<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlas Plane</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: { atlas: { bg: '#000000', panel: '#0a0a0a' } }
        }
      }
    };
  </script>
  <style>
    body { background: #000; }
    .icon-glow-emerald { box-shadow: 0 0 0 1px rgba(16,185,129,.45), 0 0 20px rgba(16,185,129,.24); }
    .icon-glow-white { box-shadow: 0 0 0 1px rgba(255,255,255,.35), 0 0 20px rgba(255,255,255,.15); }
  </style>
</head>
<body class="bg-black text-zinc-100 font-sans antialiased">
  <div id="root" class="min-h-screen grid place-items-center text-zinc-500 text-sm">Loading Atlas Plane UI…</div>

  <script type="module">
    const rootEl = document.getElementById('root');
    function renderError(message) {
      rootEl.innerHTML = `<div class="mx-auto mt-10 max-w-2xl rounded-xl border border-zinc-800/60 bg-[#0a0a0a] p-6 text-zinc-200"><h1 class="mb-2 font-semibold tracking-tight text-zinc-100">Atlas Plane UI failed to load</h1><p class="mb-3 text-sm text-zinc-400">${message}</p></div>`;
    }

    let React;
    let createRoot;
    try {
      const reactMod = await import('https://esm.sh/react@18.3.1');
      const reactDomMod = await import('https://esm.sh/react-dom@18.3.1/client');
      React = reactMod;
      createRoot = reactDomMod.createRoot;
    } catch (error) {
      renderError(error?.message || String(error));
      throw error;
    }

    const { useEffect, useMemo, useState } = React;
    const h = React.createElement;

    function Icon({ name, className = 'h-4 w-4' }) {
      const props = {
        className,
        viewBox: '0 0 24 24',
        fill: 'none',
        stroke: 'currentColor',
        strokeWidth: '2',
        strokeLinecap: 'round',
        strokeLinejoin: 'round'
      };

      switch (name) {
        case 'layers':
          return h('svg', props,
            h('polygon', { points: '12 2 2 7 12 12 22 7 12 2' }),
            h('polyline', { points: '2 17 12 22 22 17' }),
            h('polyline', { points: '2 12 12 17 22 12' })
          );
        case 'server':
          return h('svg', props,
            h('rect', { x: '2', y: '2', width: '20', height: '8', rx: '2' }),
            h('rect', { x: '2', y: '14', width: '20', height: '8', rx: '2' }),
            h('line', { x1: '6', y1: '6', x2: '6.01', y2: '6' }),
            h('line', { x1: '6', y1: '18', x2: '6.01', y2: '18' })
          );
        case 'box':
          return h('svg', props,
            h('path', { d: 'M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z' }),
            h('polyline', { points: '3.3 7 12 12 20.7 7' }),
            h('line', { x1: '12', y1: '22', x2: '12', y2: '12' })
          );
        case 'shield':
          return h('svg', props,
            h('path', { d: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z' })
          );
        case 'user':
          return h('svg', props,
            h('path', { d: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2' }),
            h('circle', { cx: '12', cy: '7', r: '4' })
          );
        case 'search':
          return h('svg', props,
            h('circle', { cx: '11', cy: '11', r: '8' }),
            h('line', { x1: '21', y1: '21', x2: '16.65', y2: '16.65' })
          );
        case 'dot':
          return h('svg', props, h('circle', { cx: '12', cy: '12', r: '2.2', fill: 'currentColor', stroke: 'none' }));
        case 'power':
          return h('svg', props,
            h('path', { d: 'M12 2v10' }),
            h('path', { d: 'M18.4 6.6a9 9 0 1 1-12.8 0' })
          );
        case 'restart':
          return h('svg', props,
            h('polyline', { points: '23 4 23 10 17 10' }),
            h('path', { d: 'M20.49 15a9 9 0 1 1-2.12-9.36L23 10' })
          );
        case 'terminal':
          return h('svg', props,
            h('polyline', { points: '4 17 10 11 4 5' }),
            h('line', { x1: '12', y1: '19', x2: '20', y2: '19' })
          );
        case 'trash':
          return h('svg', props,
            h('polyline', { points: '3 6 5 6 21 6' }),
            h('path', { d: 'M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2' })
          );
        case 'check':
          return h('svg', props, h('polyline', { points: '20 6 9 17 4 12' }));
        case 'x':
          return h('svg', props,
            h('line', { x1: '18', y1: '6', x2: '6', y2: '18' }),
            h('line', { x1: '6', y1: '6', x2: '18', y2: '18' })
          );
        case 'clock':
          return h('svg', props,
            h('circle', { cx: '12', cy: '12', r: '10' }),
            h('polyline', { points: '12 6 12 12 16 14' })
          );
        case 'square':
          return h('svg', props, h('rect', { x: '6', y: '6', width: '12', height: '12', rx: '1' }));
        default:
          return null;
      }
    }

    const mockVMs = [
      { id: 201, name: 'atlas-api-01', os: 'ubuntu', node: 'pve1', vcpu: 4, ram: 8192, uptime: 248390, status: 'running', cpuUsage: 38, memUsage: 64, tags: ['api', 'prod'] },
      { id: 202, name: 'atlas-db-01', os: 'debian', node: 'pve1', vcpu: 8, ram: 16384, uptime: 817300, status: 'running', cpuUsage: 71, memUsage: 88, tags: ['database', 'critical'] },
      { id: 203, name: 'edge-fw-01', os: 'opnsense', node: 'pve1', vcpu: 2, ram: 4096, uptime: 0, status: 'stopped', cpuUsage: 0, memUsage: 0, tags: ['network', 'firewall'] },
      { id: 204, name: 'atlas-worker-03', os: 'ubuntu', node: 'pve2', vcpu: 4, ram: 8192, uptime: 123600, status: 'running', cpuUsage: 24, memUsage: 53, tags: ['worker'] }
    ];

    const osMeta = {
      ubuntu: { label: 'U', cls: 'bg-orange-500/20 text-orange-300 border-orange-500/50' },
      debian: { label: 'D', cls: 'bg-red-500/20 text-red-300 border-red-500/50' },
      opnsense: { label: 'O', cls: 'bg-cyan-500/20 text-cyan-300 border-cyan-500/50' }
    };

    const barColor = (v) => (v >= 90 ? 'bg-red-500' : v >= 75 ? 'bg-orange-500' : 'bg-blue-500');

    const fmtUptime = (seconds) => {
      if (!seconds) return '—';
      if (seconds < 3600) return `${Math.floor(seconds / 60)}m`;
      if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ${Math.floor((seconds % 3600) / 60)}m`;
      return `${Math.floor(seconds / 86400)}d ${Math.floor((seconds % 86400) / 3600)}h`;
    };

    const normalizeVM = (vm) => {
      const vcpu = vm.vcpu ?? vm.vCPU ?? vm.maxcpu ?? 1;
      const maxmemMiB = vm.maxmem ? Math.round(vm.maxmem / (1024 * 1024)) : undefined;
      const ram = vm.ram ?? maxmemMiB ?? 1024;
      const cpuUsage = vm.cpuUsage ?? (vm.cpu != null && vcpu ? Math.min(100, Math.round((vm.cpu / vcpu) * 100)) : 0);
      const memUsage = vm.memUsage ?? (vm.mem != null && vm.maxmem ? Math.min(100, Math.round((vm.mem / vm.maxmem) * 100)) : 0);
      return {
        id: vm.id ?? vm.vmid,
        name: vm.name ?? `vm-${vm.vmid}`,
        os: vm.os ?? 'ubuntu',
        node: vm.node ?? 'pve1',
        vcpu,
        ram,
        uptime: vm.uptime ?? 0,
        status: vm.status === 'running' ? 'running' : 'stopped',
        cpuUsage,
        memUsage,
        tags: Array.isArray(vm.tags) ? vm.tags : []
      };
    };

    function App() {
      const [cluster, setCluster] = useState('pve1');
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [search, setSearch] = useState('');
      const [selectedIds, setSelectedIds] = useState([]);
      const [vms, setVms] = useState(mockVMs);

      useEffect(() => {
        const run = async () => {
          try {
            const response = await fetch('/api/vms');
            if (!response.ok) return;
            const data = await response.json();
            const items = Array.isArray(data.vms) ? data.vms : [];
            if (items.length > 0) setVms(items.map(normalizeVM).filter((vm) => vm.id != null));
          } catch {
          }
        };
        run();
      }, []);

      const filtered = useMemo(() => {
        const q = search.trim().toLowerCase();
        if (!q) return vms;
        return vms.filter((vm) => vm.name.toLowerCase().includes(q) || String(vm.id).includes(q) || (vm.tags || []).some((tag) => tag.toLowerCase().includes(q)));
      }, [search, vms]);

      const runningCount = vms.filter((vm) => vm.status === 'running').length;

      const toggleSelected = (id) => {
        setSelectedIds((prev) => prev.includes(id) ? prev.filter((value) => value !== id) : [...prev, id]);
      };

      return h('div', { className: 'min-h-screen w-full bg-black text-zinc-100' },
        h('div', { className: 'flex w-full' },
          h('aside', { className: 'fixed left-0 top-0 flex h-screen w-64 flex-col border-r border-zinc-800/60 bg-[#0a0a0a] p-4' },
            h('div', { className: 'mb-6 flex items-center gap-2' }, h(Icon, { name: 'layers', className: 'h-4 w-4 text-blue-500' }), h('span', { className: 'font-bold tracking-tight' }, 'Atlas Plane')),
            h('div', { className: 'space-y-4' },
              h('div', null,
                h('p', { className: 'mb-1 text-xs font-medium uppercase tracking-wide text-zinc-500' }, 'Resources'),
                h('nav', { className: 'space-y-1 text-sm' },
                  h('button', { className: 'flex w-full items-center gap-2 rounded-md bg-zinc-900 px-3 py-2 text-left font-medium' }, h(Icon, { name: 'server', className: 'h-4 w-4' }), 'Virtual Machines'),
                  h('button', { className: 'flex w-full items-center gap-2 rounded-md px-3 py-2 text-left text-zinc-400 transition duration-300 hover:bg-zinc-900 hover:text-zinc-100' }, h(Icon, { name: 'box', className: 'h-4 w-4' }), 'Templates')
                )
              ),
              h('div', null,
                h('p', { className: 'mb-1 text-xs font-medium uppercase tracking-wide text-zinc-500' }, 'System'),
                h('nav', { className: 'space-y-1 text-sm' },
                  h('button', { className: 'flex w-full items-center gap-2 rounded-md px-3 py-2 text-left text-zinc-400 transition duration-300 hover:bg-zinc-900 hover:text-zinc-100' }, h(Icon, { name: 'shield', className: 'h-4 w-4' }), 'Security')
                )
              )
            ),
            h('button', { className: 'mt-auto flex items-center gap-2 rounded-md border border-zinc-800/60 bg-black px-3 py-2 text-sm text-zinc-300 transition duration-300 hover:border-zinc-700 active:scale-95' }, h(Icon, { name: 'user', className: 'h-4 w-4' }), 'ops@atlas')
          ),
          h('main', { className: 'ml-64 flex-1 min-w-0' },
            h('header', { className: 'sticky top-0 z-30 border-b border-zinc-800/60 bg-black/75 px-6 py-3 backdrop-blur' },
              h('div', { className: 'flex items-center gap-3' },
                h('div', { className: 'relative w-full max-w-2xl' },
                  h('span', { className: 'pointer-events-none absolute left-3 top-2 text-zinc-500' }, h(Icon, { name: 'search', className: 'h-4 w-4' })),
                  h('input', {
                    value: search,
                    onInput: (event) => setSearch(event.target.value),
                    placeholder: 'Search by name, id, tag...',
                    className: 'w-full rounded-md border border-zinc-800/60 bg-[#0a0a0a] py-2 pl-9 pr-16 text-sm outline-none transition duration-300 focus:border-zinc-600'
                  }),
                  h('kbd', { className: 'absolute right-2 top-2 rounded border border-zinc-800 px-1.5 py-0.5 font-mono text-[10px] text-zinc-500' }, '⌘K')
                ),
                h('select', {
                  value: cluster,
                  onChange: (event) => setCluster(event.target.value),
                  className: 'rounded-md border border-zinc-800/60 bg-[#0a0a0a] px-3 py-2 text-xs font-medium text-zinc-300 outline-none'
                },
                  h('option', { value: 'pve1' }, 'Cluster: pve1'),
                  h('option', { value: 'pve2' }, 'Cluster: pve2')
                )
              )
            ),
            h('section', { className: 'w-full p-6' },
              h('div', { className: 'mb-4 flex items-center justify-between' },
                h('div', null,
                  h('h1', { className: 'font-bold tracking-tight' }, 'Virtual Machines'),
                  h('p', { className: 'text-xs font-medium text-zinc-500' }, `${runningCount} running · ${vms.length - runningCount} stopped · ${selectedIds.length} selected`)
                ),
                h('div', { className: 'flex items-center gap-2' },
                  h('button', { className: 'rounded-md border border-zinc-800/60 bg-[#0a0a0a] px-3 py-2 text-xs font-medium text-zinc-300 transition duration-300 hover:text-zinc-100 active:scale-95' }, 'Start'),
                  h('button', { className: 'rounded-md border border-zinc-800/60 bg-[#0a0a0a] px-3 py-2 text-xs font-medium text-zinc-300 transition duration-300 hover:text-zinc-100 active:scale-95' }, 'Stop'),
                  h('button', { onClick: () => setDrawerOpen(true), className: 'rounded-md bg-white px-3 py-2 text-xs font-medium text-black transition duration-300 hover:opacity-90 active:scale-95' }, 'Deploy VM')
                )
              ),
              h('div', { className: 'space-y-3' },
                h('div', { className: 'grid grid-cols-[1.35fr_1.35fr_.8fr_auto] items-center gap-4 px-4 text-[11px] font-semibold uppercase tracking-[0.08em] text-zinc-500' },
                  h('span', null, 'Instance & Meta'),
                  h('span', { className: 'pr-4' }, 'Resource Usage'),
                  h('span', { className: 'pl-2' }, 'Tags'),
                  h('span', { className: 'text-right pr-2' }, 'Actions')
                ),
                ...filtered.map((vm) => {
                  const running = vm.status === 'running';
                  const meta = osMeta[vm.os] || osMeta.ubuntu;
                  const selected = selectedIds.includes(vm.id);
                  const tags = (Array.isArray(vm.tags) && vm.tags.length > 0 ? vm.tags : ['untagged']).slice(0, 2);
                  const ring = selected
                    ? h('div', { className: 'icon-glow-white flex h-10 w-10 items-center justify-center rounded-full bg-white text-black' }, h(Icon, { name: 'check', className: 'h-4 w-4' }))
                    : h('div', { className: `relative flex h-10 w-10 items-center justify-center rounded-full border ${running ? 'border-emerald-500 icon-glow-emerald' : 'border-zinc-700'} ${meta.cls}` },
                        h(Icon, { name: 'box', className: 'h-3.5 w-3.5' }),
                        h('span', { className: 'absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 rounded-full border border-black bg-emerald-400' })
                      );

                  return h('div', { key: vm.id, className: 'w-full rounded-lg border border-zinc-800/70 bg-[#050505] px-4 py-3 transition duration-300 hover:border-zinc-700' },
                    h('div', { className: 'grid grid-cols-[1.35fr_1.35fr_.8fr_auto] items-center gap-4' },
                      h('div', { className: 'flex items-center gap-4 min-w-0' },
                        h('button', { onClick: () => toggleSelected(vm.id), className: 'active:scale-95 transition duration-300', 'aria-label': `Select ${vm.name}` }, ring),
                        h('div', { className: 'min-w-0 pr-2' },
                          h('div', { className: 'flex items-center gap-2' },
                            h('p', { className: 'truncate text-sm font-semibold tracking-tight text-zinc-100' }, vm.name),
                            h('span', { className: 'rounded border border-zinc-800 bg-zinc-950 px-1.5 py-0.5 font-mono text-[10px] text-zinc-400' }, `#${vm.id}`)
                          ),
                          h('div', { className: 'mt-1 flex items-center gap-3 text-xs text-zinc-500' },
                            h('span', { className: 'inline-flex items-center gap-1' }, h(Icon, { name: 'server', className: 'h-3 w-3' }), vm.node),
                            h('span', { className: 'inline-flex items-center gap-1' }, h(Icon, { name: 'clock', className: 'h-3 w-3' }), fmtUptime(vm.uptime))
                          )
                        )
                      ),
                      h('div', { className: 'space-y-2 py-0.5 pr-4' },
                        h('div', { className: 'space-y-1' },
                          h('div', { className: 'flex items-center justify-between text-xs font-medium text-zinc-500' },
                            h('div', { className: 'inline-flex items-center gap-1.5' }, h(Icon, { name: 'dot', className: 'h-3 w-3 text-zinc-500' }), h('span', null, 'CPU'), h('span', { className: 'font-mono text-zinc-300' }, `${vm.vcpu} vCPU`)),
                            h('span', { className: 'font-mono text-zinc-300' }, `${vm.cpuUsage}%`)
                          ),
                          h('div', { className: 'h-0.5 w-full rounded-full bg-zinc-900' }, h('div', { className: `h-0.5 rounded-full ${barColor(vm.cpuUsage)}`, style: { width: `${vm.cpuUsage}%` } }))
                        ),
                        h('div', { className: 'space-y-1' },
                          h('div', { className: 'flex items-center justify-between text-xs font-medium text-zinc-500' },
                            h('div', { className: 'inline-flex items-center gap-1.5' }, h(Icon, { name: 'dot', className: 'h-3 w-3 text-zinc-500' }), h('span', null, 'MEM'), h('span', { className: 'font-mono text-zinc-300' }, `${(vm.ram / 1024).toFixed(1)} GiB`)),
                            h('span', { className: 'font-mono text-zinc-300' }, `${vm.memUsage}%`)
                          ),
                          h('div', { className: 'h-0.5 w-full rounded-full bg-zinc-900' }, h('div', { className: `h-0.5 rounded-full ${barColor(vm.memUsage)}`, style: { width: `${vm.memUsage}%` } }))
                        )
                      ),
                      h('div', { className: 'flex flex-col gap-1.5 justify-center pl-2' },
                        ...tags.map((tag) => h('span', { key: `${vm.id}-${tag}`, className: 'w-max rounded border border-zinc-800 bg-zinc-950 px-2 py-1 text-[10px] font-semibold uppercase tracking-wide text-zinc-300' }, String(tag).replace(/_/g, '-')))
                      ),
                      h('div', { className: 'flex items-center justify-end gap-1' },
                        h('button', { className: 'rounded-md p-2 text-zinc-500 transition duration-300 hover:text-zinc-100 active:scale-95' }, h(Icon, { name: 'square', className: 'h-3.5 w-3.5' })),
                        h('button', { className: 'rounded-md p-2 text-zinc-500 transition duration-300 hover:text-zinc-100 active:scale-95' }, h(Icon, { name: 'restart', className: 'h-3.5 w-3.5' })),
                        h('button', { className: 'rounded-md p-2 text-zinc-500 transition duration-300 hover:text-zinc-100 active:scale-95' }, h(Icon, { name: 'terminal', className: 'h-3.5 w-3.5' })),
                        h('button', { className: 'rounded-md p-2 text-zinc-500 transition duration-300 hover:text-red-400 active:scale-95' }, h(Icon, { name: 'trash', className: 'h-3.5 w-3.5' }))
                      )
                    )
                  );
                })
              )
            )
          )
        ),
        drawerOpen ? h('div', { className: 'fixed inset-0 z-50' },
          h('div', { className: 'absolute inset-0 bg-black/60 backdrop-blur-sm', onClick: () => setDrawerOpen(false) }),
          h('aside', { className: 'absolute right-0 top-0 h-full w-full max-w-xl border-l border-zinc-800/60 bg-[#0a0a0a]' },
            h('div', { className: 'flex items-center justify-between border-b border-zinc-800/60 px-6 py-4' },
              h('div', null,
                h('h2', { className: 'font-bold tracking-tight' }, 'Deploy VM'),
                h('p', { className: 'text-xs font-medium text-zinc-500' }, `Cluster ${cluster}`)
              ),
              h('button', { onClick: () => setDrawerOpen(false), className: 'rounded-md border border-zinc-800/60 p-2 text-zinc-400 transition duration-300 hover:text-zinc-100 active:scale-95' }, h(Icon, { name: 'x', className: 'h-4 w-4' }))
            ),
            h('div', { className: 'h-[calc(100%-73px)] overflow-y-auto p-6 space-y-6' },
              h('section', { className: 'space-y-3 rounded-xl border border-zinc-800/60 bg-black/40 p-4' },
                h('h3', { className: 'text-xs font-medium uppercase tracking-wide text-zinc-500' }, 'General Config'),
                h('div', { className: 'grid grid-cols-2 gap-3' },
                  h('input', { className: 'rounded-md border border-zinc-800/60 bg-black px-3 py-2 text-sm outline-none', placeholder: 'VM Name' }),
                  h('input', { className: 'rounded-md border border-zinc-800/60 bg-black px-3 py-2 text-sm outline-none', placeholder: 'Node (e.g. pve1)' })
                )
              ),
              h('section', { className: 'space-y-3 rounded-xl border border-zinc-800/60 bg-black/40 p-4' },
                h('h3', { className: 'text-xs font-medium uppercase tracking-wide text-zinc-500' }, 'OS Templates'),
                h('div', { className: 'grid grid-cols-3 gap-2' },
                  h('button', { className: 'rounded-md border border-zinc-800/60 bg-black px-3 py-2 text-xs font-medium text-zinc-300' }, 'ubuntu'),
                  h('button', { className: 'rounded-md border border-zinc-800/60 bg-black px-3 py-2 text-xs font-medium text-zinc-300' }, 'debian'),
                  h('button', { className: 'rounded-md border border-zinc-800/60 bg-black px-3 py-2 text-xs font-medium text-zinc-300' }, 'opnsense')
                )
              ),
              h('section', { className: 'space-y-4 rounded-xl border border-zinc-800/60 bg-black/40 p-4' },
                h('h3', { className: 'text-xs font-medium uppercase tracking-wide text-zinc-500' }, 'Resources'),
                h('div', null, h('label', { className: 'mb-1 block text-xs font-medium text-zinc-500' }, 'vCPU'), h('input', { type: 'range', min: '1', max: '16', defaultValue: '4', className: 'w-full accent-blue-500' })),
                h('div', null, h('label', { className: 'mb-1 block text-xs font-medium text-zinc-500' }, 'RAM (MiB)'), h('input', { type: 'range', min: '512', max: '32768', step: '512', defaultValue: '4096', className: 'w-full accent-blue-500' })),
                h('div', null, h('label', { className: 'mb-1 block text-xs font-medium text-zinc-500' }, 'Disk (GB)'), h('input', { type: 'range', min: '10', max: '200', defaultValue: '40', className: 'w-full accent-blue-500' })),
                h('button', { className: 'w-full rounded-md bg-white py-2 text-sm font-medium text-black transition duration-300 hover:opacity-90 active:scale-95' }, 'Launch Deployment')
              )
            )
          )
        ) : null

    }

    try {
      createRoot(rootEl).render(h(App));
