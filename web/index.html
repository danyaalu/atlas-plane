              return `<tr>
                <td><span class="tpl-click${selected === t.name ? ' active' : ''}" data-action="template-select" data-template="${esc(t.name)}">${esc(t.name)}</span></td>
                <td class="tpl-vmid">${vmidEntries.length ? vmidEntries.map(([node, vmid]) => `${esc(node)}:${esc(String(vmid))}`).join(' · ') : '—'}</td>
                <td>${t.readyCount || 0} / ${t.totalNodes || 0}</td>
                <td>${t.outOfSync || 0}</td>
                <td><span class="tpl-state-pill ${healthy ? 'ok' : 'warn'}">${healthy ? 'Ready' : 'Build required'}</span></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>

        <h3 style="margin-top:16px">Template Builder</h3>
        <div class="tpl-build-grid">
          <div class="tpl-field">
            <label>Node</label>
            <select data-action="template-build-node">
              ${module.nodes.map(n => `<option value="${esc(n.node)}"${module.buildNode === n.node ? ' selected' : ''}>${esc(n.node)} ${n.reachable ? '' : '(offline)'}</option>`).join('')}
            </select>
          </div>
          <div class="tpl-field">
            <label>Node VMID</label>
            <input type="number" min="100" max="999999999" value="${esc(vmidInputValue)}" data-action="template-vmid-input" placeholder="${buildNodeState?.vmid > 0 ? esc(String(buildNodeState.vmid)) : esc(String(suggestedBuildVmid))}">
          </div>
          <button class="btn btn-primary" data-action="template-build" ${module.busy ? 'disabled' : ''}>${module.busy ? '<span class="spinner"></span> Building…' : Icons.bolt + ' Build Template'}</button>
        </div>
        <div style="font-size:0.72rem;color:var(--text-3);margin-top:8px">
          Optional: leave blank to auto-select the next free VMID from 9000 for this node.
        </div>
      </div>

      <div class="tpl-panel">
        <h3>Node Configuration</h3>
        <div class="tpl-nodes">
          ${module.nodes.length === 0 ? `<div class="node-loading">${module.loading ? '<span class="spinner"></span> Loading nodes…' : 'No nodes available.'}</div>` : module.nodes.map(n => {
            const ns = nodeStates[n.node] || { status: 'Missing' };

                <option value="">Select target storage</option>

        </div>
      </div>
    </div>`;
}

function TemplatesPage() {
  return `<section id="page-templates" class="page${state.page === 'templates' ? ' active' : ''}">
    ${TemplatesPageContent()}
  </section>`;
}

function renderTemplatesPage() {
  const page = document.getElementById('page-templates');
  if (!page) return;

  const previousConsole = page.querySelector('.tpl-console');
  let previousScrollTop = 0;
  let wasNearBottom = true;
  if (previousConsole) {
    previousScrollTop = previousConsole.scrollTop;
    const gapToBottom = previousConsole.scrollHeight - (previousConsole.scrollTop + previousConsole.clientHeight);
    wasNearBottom = gapToBottom <= 12;
  }

  page.innerHTML = TemplatesPageContent();

  const nextConsole = page.querySelector('.tpl-console');
  if (nextConsole) {
    if (wasNearBottom) {
      nextConsole.scrollTop = nextConsole.scrollHeight;
    } else {
      const maxTop = Math.max(0, nextConsole.scrollHeight - nextConsole.clientHeight);
      nextConsole.scrollTop = Math.min(previousScrollTop, maxTop);
    }
  }
}

function isTemplateInteractionActive() {
  const root = document.getElementById('page-templates');
  if (!root) return false;
  const active = document.activeElement;
  if (!active || active === document.body) return false;
  if (!root.contains(active)) return false;
  const tag = (active.tagName || '').toLowerCase();
  return tag === 'input' || tag === 'select' || tag === 'textarea' || active.isContentEditable;
}

      <div class="qty-label-grp">
        <div class="qty-title">Quantity</div>
        <div class="qty-sub">Number of VMs to provision</div>
      </div>
      <div class="qty-stepper">
        <button class="qty-btn" data-action="prov-decrement" ${state.prov.vmCount <= 1 ? 'disabled' : ''}>−</button>
        <span class="qty-val" id="prov-count-val">${state.prov.vmCount}</span>
        <button class="qty-btn" data-action="prov-increment" ${state.prov.vmCount >= 20 ? 'disabled' : ''}>+</button>
      </div>
    </div>
    <div class="start-vmid-row">
      <label>Starting VMID</label>
      <input type="number" id="prov-start-vmid" value="${state.prov.vmStartId}" min="100" max="9999">
    </div>
    <div class="start-vmid-row" style="margin-top:10px">
      <label>VM Name <span style="font-weight:400;color:var(--text-3)">(optional)</span></label>
      <input type="text" id="prov-vm-name" value="${esc(state.prov.vmName)}"
        placeholder="e.g. my-vm" maxlength="40" style="font-family:inherit">
    </div>
    ${state.prov.vmCount > 1 && previewVMName
      ? `<div id="prov-vm-name-hint" style="font-size:0.78rem;color:var(--text-3);margin-top:4px">
           VMs will be named <strong>${esc(previewVMName)}-01</strong> … <strong>${esc(previewVMName)}-${String(state.prov.vmCount).padStart(2,'0')}</strong>
         </div>`
      : `<div id="prov-vm-name-hint" style="font-size:0.78rem;color:var(--text-3);margin-top:4px"></div>`}
  </div>`;

  return osSection + instanceSection + nodeSection + configSection;
}

/* ── Drawer ────────────────────────────────────────────────────────────── */
function Drawer() {
  if (!state.drawerOpen) return '';

  const showPipeline = state.prov.stage === 'running' || state.prov.stage === 'done';
  const isLaunching  = !!(state.activeJobId && !state.jobDone);
  const hasProf  = !!state.prov.profile;
  const hasTmpl  = !!state.prov.template;
  const hasNode  = !!state.prov.node;
  const canLaunch = hasProf && hasTmpl && hasNode && !isLaunching;

  const vmCount = state.prov.vmCount;
  const launchLabel = isLaunching
    ? '<span class="spinner" style="border-top-color:#fff"></span> Deploying…'
    : `${Icons.rocketLaunch} Deploy ${vmCount > 1 ? vmCount + ' VMs' : 'VM'}`;

  const bodyContent = showPipeline
    ? `<div class="drawer-pipeline" id="provision-content-area">${ProvisionPipelineView()}</div>`
    : `<div id="provision-content-area">${DrawerWizardContent()}</div>`;

  const footer = showPipeline
    ? (state.prov.stage === 'done' ? `
      <button class="btn btn-ghost" data-action="drawer-close">Close</button>
      <span class="spacer"></span>
      <button class="btn btn-secondary btn-sm" data-action="prov-new">← Deploy Another</button>` : `
      <span class="drawer-cost-est"><strong>${Object.keys(state.provVMs).length}</strong> VMs provisioning…</span>
      <span class="spacer"></span>
      <button class="btn btn-ghost btn-sm" disabled>In Progress</button>`)
    : `
      <button class="btn btn-ghost" data-action="drawer-close">Cancel</button>
      <span class="spacer"></span>
      <button class="btn btn-primary" id="btn-launch" data-action="submit-provision"
        ${canLaunch ? '' : 'disabled'} style="min-width:140px;justify-content:center">
        ${launchLabel}
      </button>`;

  return `
  <div class="drawer-backdrop" data-action="backdrop-click"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="Deploy Virtual Machine">
    <div class="drawer-hd">
      <div class="drawer-hd-left">
        <div class="drawer-hd-icon">${Icons.rocketLaunch}</div>
        <div>
          <div class="drawer-title">Deploy Virtual Machine</div>
          <div class="drawer-subtitle">Configure and launch new instances</div>
        </div>
      </div>
      <button class="drawer-close tip" data-tip="Close" data-action="drawer-close">${Icons.x}</button>
    </div>
    <div class="drawer-body">${bodyContent}</div>
    <div class="drawer-ft">${footer}</div>
  </aside>`;
}

/* ── Header ────────────────────────────────────────────────────────────── */
function Header() {
  const connected = !!state.config.proxmoxUrl;
  const connClass = connected ? '' : ' disconnected';

  return `<header class="header">
    <div class="header-brand">
      ${Icons.layers}
      Atlas Plane
      <span class="header-brand-dot"></span>
    </div>
    <nav class="header-nav">
      <button class="nav-tab${state.page === 'vms' ? ' active' : ''}" data-action="switch-page" data-page="vms">Virtual Machines</button>
      <button class="nav-tab${state.page === 'templates' ? ' active' : ''}" data-action="switch-page" data-page="templates">Templates</button>
    </nav>
    <div class="header-right">
      <div class="header-status${connClass}">
        <span class="header-status-dot"></span>
        <span>${connected ? esc(state.config.node || 'Connected') : 'Disconnected'}</span>
      </div>
    </div>
  </header>`;
}

/* ── App Root ──────────────────────────────────────────────────────────── */
function App() {
  const blurClass = state.drawerOpen ? ' layout-blur' : '';
  return `<div class="app-root${blurClass}" id="layout-root">
    ${Header()}
    <main class="main">
      ${VMsPage()}
      ${TemplatesPage()}
    </main>
    ${BulkActionBar()}
  </div>
  ${Drawer()}`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   Render System
   ═══════════════════════════════════════════════════════════════════════════ */

function render() {
  document.getElementById('app').innerHTML = App();
  attachPostRenderHooks();
}

function renderVMGrid() {
  const container = document.getElementById('vm-grid');
  if (!container) return;
  const vms = getFilteredVMs();
  const allVMs = state.vms.filter(v => !v.template);
  const running = allVMs.filter(v => v.status === 'running').length;
  const stopped = allVMs.filter(v => v.status === 'stopped').length;
  const total = allVMs.length;

  const hasFilters = state.filters.search || state.filters.node !== 'all' ||
    state.filters.provisioning !== 'all' || state.filters.status !== 'all';

  if (state.vmsLoading) {
    container.innerHTML = `<div class="skeleton-grid">
      ${Array(6).fill('<div class="skeleton-card"></div>').join('')}
    </div>`;
  } else if (vms.length === 0 && total === 0) {
    container.innerHTML = `<div class="empty-state">
      ${Icons.monitor}
      <p>No virtual machines found</p>
      <p class="sub">Provision your first VM to get started</p>
      <button class="btn btn-primary" data-action="switch-page" data-page="provision">${Icons.plus} Provision VMs</button>
    </div>`;
  } else if (vms.length === 0 && hasFilters) {
    container.innerHTML = `<div class="empty-state">
      ${Icons.search}
      <p>No VMs match your filters</p>
      <p class="sub">Try adjusting your search or filter criteria</p>
      <button class="btn btn-secondary" data-action="clear-filters">Clear Filters</button>
    </div>`;
  } else {
    const containerClass = state.viewMode === 'list' ? 'vm-list' : 'vm-grid';
    const shouldAnimate = state.vmsInitialLoad || state.animateNextRender;
    const noAnimateClass = shouldAnimate ? '' : ' no-animate';
    const renderFn = state.viewMode === 'list' ? VMListItem : VMCard;
    container.innerHTML = `<div class="${containerClass}${noAnimateClass}" id="vm-grid-inner">${vms.map((vm, i) => renderFn(vm, i)).join('')}</div>`;

    // After first render with VMs, disable enter animations for subsequent data updates
    if (state.vmsInitialLoad && vms.length > 0) state.vmsInitialLoad = false;
    state.animateNextRender = false;

    // Apply status-change flash to cards whose status changed since last load
    if (state.changedVmIds.size > 0) {
      state.changedVmIds.forEach(vmid => {
        const card = container.querySelector(`[data-vmid-card="${vmid}"]`);
        if (card) {
          card.classList.add('status-changed');
          card.addEventListener('animationend', () => card.classList.remove('status-changed'), { once: true });
        }
      });
      state.changedVmIds.clear();
    }
  }

  // Update stats
  const statsEl = document.querySelector('.stats-row');
  if (statsEl) {
    statsEl.innerHTML = `
      <span class="stat-item"><span class="stat-dot total"></span><strong>${total}</strong>&nbsp;VMs</span>
      <span class="stat-item"><span class="stat-dot running"></span>${running} Running</span>
      <span class="stat-item"><span class="stat-dot stopped"></span>${stopped} Stopped</span>`;
  }
}

function renderProvisionProgress() {
  const panel = document.getElementById('prov-pipeline-content');
  if (panel) panel.innerHTML = ProvisionPipeline();
}

function updateBulkActionBar() {
  const bar = document.querySelector('.bulk-action-bar');
  if (!bar) return;
  const count = state.selectedVMs.size;
  const visible = count > 0;
  bar.classList.toggle('visible', visible);
  const countEl = bar.querySelector('.bulk-action-count');
  if (countEl) {
    countEl.innerHTML = `<strong>${count}</strong> VM${count !== 1 ? 's' : ''} selected`;
  }
}

function attachPostRenderHooks() {
  // Restore search value focus if needed
}

/* ═══════════════════════════════════════════════════════════════════════════
   Event Handling
   ═══════════════════════════════════════════════════════════════════════════ */

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;

  const action = el.dataset.action;

  switch (action) {
    case 'switch-page':
      switchPage(el.dataset.page);
      break;

    case 'template-refresh':
      await loadTemplateState();
      break;

    case 'template-select': {
      const templateName = el.dataset.template;
      if (!templateName) break;
      state.templateMgr.selectedTemplate = templateName;
      await loadTemplateState();
      break;
    }

    case 'template-build':
      await runTemplateBuild();
      break;

    case 'template-log-node':
      state.templateMgr.selectedNode = el.dataset.node || '';
      renderTemplatesPage();
      break;

    case 'open-drawer':
      openDrawer();
      break;

    case 'drawer-close':
      closeDrawer();
      break;

    case 'backdrop-click':
      if (e.target === el) closeDrawer();
      break;

    case 'drawer-select-template': {
      state.prov.template = el.dataset.template;
      document.querySelectorAll('.os-card').forEach(c =>
        c.classList.toggle('selected', c.dataset.template === state.prov.template));
      const secOS = document.getElementById('drawer-sec-os');
      const numOS = secOS?.querySelector('.drawer-step-num');
      if (numOS) { numOS.className = 'drawer-step-num done'; numOS.innerHTML = Icons.check; }
      // Show/update chip
      const tmplObj = TEMPLATES.find(t => t.id === state.prov.template);
      const hdOS = secOS?.querySelector('.drawer-section-hd');
      let chipOS = hdOS?.querySelector('.drawer-section-chip');
      if (!chipOS && hdOS) { chipOS = document.createElement('span'); chipOS.className = 'drawer-section-chip'; hdOS.appendChild(chipOS); }
      if (chipOS && tmplObj) chipOS.textContent = tmplObj.label;
      // Unlock instance section
      const secInst = document.getElementById('drawer-sec-instance');
      if (secInst) secInst.classList.remove('locked');
      const numInst = secInst?.querySelector('.drawer-step-num');
      if (numInst && !numInst.classList.contains('done')) numInst.classList.add('active');
      // Enable launch if ready (node must also be selected)
      const lb = document.getElementById('btn-launch');
      if (lb && state.prov.profile && state.prov.node) lb.disabled = false;
      break;
    }

    case 'drawer-select-profile': {
      state.prov.profile = el.dataset.profile;
      document.querySelectorAll('.instance-card').forEach(c =>
        c.classList.toggle('selected', c.dataset.profile === state.prov.profile));
      const secInst = document.getElementById('drawer-sec-instance');
      const numInst = secInst?.querySelector('.drawer-step-num');
      if (numInst) { numInst.className = 'drawer-step-num done'; numInst.innerHTML = Icons.check; }
      // Show/update chip
      const profObj = PROFILES.find(p => p.id === state.prov.profile);
      const hdInst = secInst?.querySelector('.drawer-section-hd');
      let chipInst = hdInst?.querySelector('.drawer-section-chip');
      if (!chipInst && hdInst) { chipInst = document.createElement('span'); chipInst.className = 'drawer-section-chip'; hdInst.appendChild(chipInst); }
      if (chipInst && profObj) chipInst.textContent = profObj.label;
      // Unlock node section
      const secNode = document.getElementById('drawer-sec-node');
      if (secNode) secNode.classList.remove('locked');
      const numNode = secNode?.querySelector('.drawer-step-num');
      if (numNode && !numNode.classList.contains('done')) numNode.classList.add('active');
      // Custom expand
      renderCustomFields();
      // Update launch button — still disabled until node is selected
      const lb2 = document.getElementById('btn-launch');
      if (lb2 && !state.prov.node) {
        lb2.disabled = true;
      }
      break;
    }

    case 'drawer-select-node': {
      state.prov.node = el.dataset.node;
      document.querySelectorAll('.node-card').forEach(c =>
        c.classList.toggle('selected', c.dataset.node === state.prov.node));
      const secNode = document.getElementById('drawer-sec-node');
      const numNode = secNode?.querySelector('.drawer-step-num');
      if (numNode) { numNode.className = 'drawer-step-num done'; numNode.innerHTML = Icons.check; }
      // Show/update chip
      const hdNode = secNode?.querySelector('.drawer-section-hd');
      let chipNode = hdNode?.querySelector('.drawer-section-chip');
      if (!chipNode && hdNode) { chipNode = document.createElement('span'); chipNode.className = 'drawer-section-chip'; hdNode.appendChild(chipNode); }
      if (chipNode) chipNode.textContent = state.prov.node;
      // Unlock config section
      const secCfg = document.getElementById('drawer-sec-config');
      if (secCfg) secCfg.classList.remove('locked');
      const numCfg = secCfg?.querySelector('.drawer-step-num');
      if (numCfg && !numCfg.classList.contains('done')) numCfg.classList.add('active');
      // Enable launch button if all required selections made
      const lb3 = document.getElementById('btn-launch');
      if (lb3 && state.prov.template && state.prov.profile) {
        lb3.disabled = false;
        lb3.innerHTML = Icons.rocketLaunch + ' Deploy ' + (state.prov.vmCount > 1 ? state.prov.vmCount + ' VMs' : 'VM');
      }
      break;
    }

    case 'refresh-vms':
      el.disabled = true;
      el.querySelector('svg')?.setAttribute('style', 'animation: spin 0.6s linear infinite');
      await loadVMs();
      el.disabled = false;
      el.querySelector('svg')?.removeAttribute('style');
      break;

    case 'toggle-view': {
      const view = el.dataset.view;
      if (view && (view === 'grid' || view === 'list')) {
        state.viewMode = view;
        state.animateNextRender = true;
        renderVMGrid();
        // Update toggle button states
        document.querySelectorAll('.view-toggle-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.view === view);
        });
      }
      break;
    }

    case 'toggle-vm': {
      const vmid = +el.dataset.vmid;
      if (state.selectedVMs.has(vmid)) {
        state.selectedVMs.delete(vmid);
      } else {
        state.selectedVMs.add(vmid);
      }
      renderVMGrid();
      updateBulkActionBar();
      break;
    }

    case 'clear-selection':
      state.selectedVMs.clear();
      renderVMGrid();
      updateBulkActionBar();
      break;

    case 'select-all': {
      const filteredVMs = getFilteredVMs().filter(vm => vm.template !== 1);
      const allSelected = filteredVMs.every(vm => state.selectedVMs.has(vm.vmid));
      
      if (allSelected) {
        // Deselect all filtered VMs
        filteredVMs.forEach(vm => state.selectedVMs.delete(vm.vmid));
      } else {
        // Select all filtered VMs
        filteredVMs.forEach(vm => state.selectedVMs.add(vm.vmid));
      }
      
      renderVMGrid();
      updateBulkActionBar();
      break;
    }

    case 'bulk-start':
    case 'bulk-stop':
    case 'bulk-restart':
    case 'bulk-delete': {
      const act = action.replace('bulk-', '');
      const vmids = Array.from(state.selectedVMs);
      if (vmids.length === 0) break;
      
      if (act === 'delete') {
        const confirmed = await showConfirm(
          'Delete VMs',
          `Are you sure you want to delete <strong>${vmids.length}</strong> VM${vmids.length !== 1 ? 's' : ''}? This action cannot be undone.`
        );
        if (!confirmed) break;
      }
      
      // Execute action for each VM (skip individual confirmations for bulk operations)
      for (const vmid of vmids) {
        const vm = state.vms.find(v => v.vmid === vmid);
        if (vm) {
          await handleVMAction(act, vmid, vm.name, true);
        }
      }
      
      state.selectedVMs.clear();
      renderVMGrid();
      updateBulkActionBar();
      break;
    }

    case 'vm-start':
    case 'vm-stop':
    case 'vm-restart':
    case 'vm-delete': {
      const vmid = +el.dataset.vmid;
      const name = el.dataset.vmname;
      const act = action.replace('vm-', '');
      await handleVMAction(act, vmid, name);
      break;
    }

    case 'vm-console': {
      const vmid = el.dataset.vmid;
      const node = el.dataset.node;
      if (state.config.proxmoxUrl) {
        window.open(`${state.config.proxmoxUrl}/?console=kvm&vmid=${vmid}&vmnode=${node}&novnc=1`, '_blank');
      } else {
        toast('Proxmox URL not configured', 'error');
      }
      break;
    }

    case 'vm-download-key': {
      const vmid = +el.dataset.vmid;
      const filename = el.dataset.keyname || `vm-${vmid}_key`;
      const a = document.createElement('a');
      a.href = `/api/vms/${vmid}/ssh-key`;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      break;
    }

    case 'copy-ssh': {
      const cmd = el.dataset.cmd;
      if (cmd) {
        await navigator.clipboard.writeText(cmd);
        toast('Setup command copied', 'success');
      }
      break;
    }

    case 'submit-provision':
      await submitProvision();
      break;

    case 'select-template': {
      state.prov.template = el.dataset.template;
      // Highlight selected card
      document.querySelectorAll('.template-card').forEach(c =>
        c.classList.toggle('selected', c.dataset.template === state.prov.template));
      // Unlock profile block
      const pb = document.getElementById('prov-block-profile');
      if (pb) pb.classList.remove('locked');
      // Update step badge
      const b1 = document.querySelector('#prov-block-os .prov-step-badge');
      if (b1) { b1.className = 'prov-step-badge done'; }
      // Update header chip
      const tmplObj = TEMPLATES.find(t => t.id === state.prov.template);
      let chip1 = document.querySelector('#prov-block-os .prov-block-chip');
      if (!chip1) {
        chip1 = document.createElement('span');
        chip1.className = 'prov-block-chip';
        document.querySelector('#prov-block-os .prov-block-header').appendChild(chip1);
      }
      if (tmplObj) chip1.textContent = tmplObj.label;
      // Update profile block badge to active
      const b2 = document.querySelector('#prov-block-profile .prov-step-badge');
      if (b2) { b2.className = 'prov-step-badge active'; }
      break;
    }

    case 'select-profile': {
      state.prov.profile = el.dataset.profile;
      // Highlight selected card
      document.querySelectorAll('.profile-card').forEach(c =>
        c.classList.toggle('selected', c.dataset.profile === state.prov.profile));
      // Unlock deploy block
      const db = document.getElementById('prov-block-deploy');
      if (db) db.classList.remove('locked');
      // Update step badge
      const b2p = document.querySelector('#prov-block-profile .prov-step-badge');
      if (b2p) { b2p.className = 'prov-step-badge done'; }
      // Update header chip
      const profObj = PROFILES.find(p => p.id === state.prov.profile);
      let chip2 = document.querySelector('#prov-block-profile .prov-block-chip');
      if (!chip2) {
        chip2 = document.createElement('span');
        chip2.className = 'prov-block-chip';
        document.querySelector('#prov-block-profile .prov-block-header').appendChild(chip2);
      }
      if (profObj) chip2.textContent = profObj.label;
      // Update deploy block badge
      const b3 = document.querySelector('#prov-block-deploy .prov-step-badge');
      if (b3) { b3.className = 'prov-step-badge active'; }
      // Toggle/re-render custom hardware fields
      renderCustomFields();
      // Update launch button text
      const lb = document.getElementById('btn-launch');
      if (lb && !lb.disabled) lb.innerHTML = Icons.bolt + '&nbsp;Launch ' + (state.prov.vmCount > 1 ? state.prov.vmCount + ' VMs' : 'VM');
      break;
    }

    case 'set-input-mode':
      state.prov.inputMode = el.dataset.mode;
      renderCustomFields();
      break;

    case 'prov-increment':
      if (state.prov.vmCount < 20) {
        state.prov.vmCount++;
        _updateCountUI();
      }
      break;

    case 'prov-decrement':
      if (state.prov.vmCount > 1) {
        state.prov.vmCount--;
        _updateCountUI();
      }
      break;

    case 'prov-new':
      if (state.activeEventSource) state.activeEventSource.close();
      stopJobTimer();
      state.prov.stage    = 'template';
      state.prov.template = null;
      state.prov.profile  = null;
      state.prov.node     = null;
      state.prov.vmCount  = 1;
      state.prov.vmName   = '';
      state.activeJobId   = null;
      state.provVMs       = {};
      state.jobDone       = false;
      state.jobEndedAt    = null;
      state.jobStartedAt  = null;
      renderProvisionWizard();
      break;

    case 'toggle-sort-dir':
      state.filters.sortDir = state.filters.sortDir === 'asc' ? 'desc' : 'asc';
      state.animateNextRender = true;
      renderVMGrid();
      // Update sort dir button tooltip
      el.dataset.tip = state.filters.sortDir === 'asc' ? 'Ascending' : 'Descending';
      break;

    case 'clear-filters':
      state.filters = { search: '', node: 'all', provisioning: 'all', status: 'all', sort: 'vmid', sortDir: 'asc' };
      state.animateNextRender = true;
      render();
      break;

    case 'segment': {
      const group = el.dataset.group;
      const value = el.dataset.value;
      state.filters[group] = value;
      // Update active segment visually
      el.closest('.segment-group').querySelectorAll('.segment-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      state.animateNextRender = true;
      renderVMGrid();
      break;
    }
  }
});

document.addEventListener('change', (e) => {
  if (e.target.dataset.action === 'template-storage') {
    const node = e.target.dataset.node;
    const storageId = e.target.value;
    if (!node || !storageId) return;
    assignTemplateStorage(state.templateMgr.selectedTemplate || 'debian12-cloud', node, storageId)
      .then(() => {
        toast(`Storage set for ${node}`, 'success');
        return loadTemplateState();
      })
      .catch(err => toast('Failed to set storage: ' + err.message, 'error'));
    return;
  }

  if (e.target.dataset.action === 'template-build-node') {
    state.templateMgr.buildNode = e.target.value;
    if (!state.templateMgr.selectedNode) state.templateMgr.selectedNode = e.target.value;
    const module = state.templateMgr;
    const selectedTpl = (module.templates || []).find(t => t.name === module.selectedTemplate);
    const nodeState = (selectedTpl?.nodeStates || []).find(ns => ns.node === module.buildNode);
    module.vmidInput = nodeState?.vmid > 0 ? Number(nodeState.vmid) : '';
    renderTemplatesPage();
    return;
  }

  if (e.target.id === 'filter-node') {
    state.filters.node = e.target.value;
    state.animateNextRender = true;
    renderVMGrid();
  }
  if (e.target.id === 'filter-sort') {
    state.filters.sort = e.target.value;
    state.animateNextRender = true;
    renderVMGrid();
  }
  if (e.target.id === 'prov-cores')   { const v = +e.target.value; if (v > 0) state.prov.customCores  = v; }
  if (e.target.id === 'prov-memory')  { const v = +e.target.value; if (v > 0) state.prov.customMemory = v; }
  if (e.target.id === 'prov-disk-num'){ const v = +e.target.value; if (v > 0) state.prov.customDisk   = v + 'G'; }
});

document.addEventListener('input', (e) => {
  if (e.target.dataset.action === 'template-vmid-input') {
    const raw = String(e.target.value || '').trim();
    if (raw === '') {
      state.templateMgr.vmidInput = '';
      return;
    }
    const n = Number(raw);
    state.templateMgr.vmidInput = Number.isFinite(n) && n > 0 ? n : '';
    return;
  }

  if (e.target.id === 'search-input') {
    state.filters.search = e.target.value;
    renderVMGrid();
  }
  // Custom profile — number inputs
  if (e.target.id === 'prov-cores')   { const v = +e.target.value; if (v > 0) state.prov.customCores  = v; }
  if (e.target.id === 'prov-memory')  { const v = +e.target.value; if (v > 0) state.prov.customMemory = v; }
  if (e.target.id === 'prov-disk-num'){ const v = +e.target.value; if (v > 0) state.prov.customDisk   = v + 'G'; }
  // Custom profile — sliders
  if (e.target.classList && e.target.classList.contains('hw-range')) {
    const field = e.target.dataset.field;
    const val   = +e.target.value;
    const min   = +e.target.min, max = +e.target.max;
    const pct   = ((val - min) / (max - min) * 100).toFixed(1) + '%';
    e.target.style.background = `linear-gradient(to right, var(--accent) ${pct}, var(--bg-3) ${pct})`;
    if (field === 'cores') {
      state.prov.customCores = val;
      const lbl = document.getElementById('hw-val-cores');
      if (lbl) lbl.textContent = val + ' vCPU';
    } else if (field === 'memory') {
      state.prov.customMemory = val;
      const lbl = document.getElementById('hw-val-memory');
      if (lbl) lbl.textContent = val >= 1024 ? (val/1024).toFixed(1).replace(/\.0$/,'') + ' GB' : val + ' MiB';
    } else if (field === 'disk') {
      state.prov.customDisk = val + 'G';
      const lbl = document.getElementById('hw-val-disk');
      if (lbl) lbl.textContent = val + ' GB';
    }
  }
  // Start VMID
  if (e.target.id === 'prov-start-vmid') {
    const v = +e.target.value;
    if (v >= 100) state.prov.vmStartId = v;
  }
  // VM Name
  if (e.target.id === 'prov-vm-name') {
    state.prov.vmName = sanitizeVMName(e.target.value, false);
    e.target.value = state.prov.vmName;
    // re-render just the preview hint without full redraw
    const previewVMName = sanitizeVMName(state.prov.vmName, true);
    const hint = document.getElementById('prov-vm-name-hint');
    if (hint) {
      hint.innerHTML = state.prov.vmCount > 1 && previewVMName
        ? `VMs will be named <strong>${esc(previewVMName)}-01</strong> … <strong>${esc(previewVMName)}-${String(state.prov.vmCount).padStart(2,'0')}</strong>`
        : '';
    }
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.drawerOpen) closeDrawer();
});

/* ═══════════════════════════════════════════════════════════════════════════
   Navigation
   ═══════════════════════════════════════════════════════════════════════════ */

function switchPage(page) {
  if (page === 'provision') { openDrawer(); return; }
  if (state.page === page) return;
  state.page = page;
  if (page === 'vms') state.animateNextRender = true;
  render();
  if (page === 'vms') loadVMs();
  if (page === 'templates') loadTemplateState();
}

/* ═══════════════════════════════════════════════════════════════════════════
   VM Actions
   ═══════════════════════════════════════════════════════════════════════════ */

async function handleVMAction(action, vmid, name, skipConfirm = false) {
  if (action === 'delete' && !skipConfirm) {
    const yes = await showConfirm('Delete VM',
      `Permanently destroy <strong>${esc(name || '')}</strong> (VMID ${vmid})?<br>This action cannot be undone.`);
    if (!yes) return;
  }

  state.loadingActions[vmid] = action;
  renderVMGrid();

  try {
    if (action === 'start') await api('POST', `/vms/${vmid}/start`);
    else if (action === 'stop') await api('POST', `/vms/${vmid}/stop`);
    else if (action === 'restart') await api('POST', `/vms/${vmid}/restart`);
    else if (action === 'delete') await api('DELETE', `/vms/${vmid}`);

    const pastTense = action === 'delete' ? 'deleted' : action === 'stop' ? 'stopped' : action === 'start' ? 'started' : 'restarting';
    toast(`VM ${vmid} ${pastTense} successfully`, 'success');
    setTimeout(loadVMs, 1200);
  } catch (err) {
    toast(`Failed to ${action} VM ${vmid}: ${err.message}`, 'error');
  } finally {
    delete state.loadingActions[vmid];
    renderVMGrid();
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   VM Loading
   ═══════════════════════════════════════════════════════════════════════════ */

async function loadVMs() {
  try {
    const vms = await api('GET', '/vms');
    const newVms = vms || [];

    // Detect status changes to flash affected cards
    newVms.forEach(vm => {
      const prev = state.prevVmStatuses[vm.vmid];
      if (prev !== undefined && prev !== vm.status) {
        state.changedVmIds.add(vm.vmid);
      }
    });
    state.prevVmStatuses = {};
    newVms.forEach(vm => { state.prevVmStatuses[vm.vmid] = vm.status; });

    state.vms = newVms;
    state.vmsLoading = false;
    renderVMGrid();
    // Update node filter options
    const nodeSelect = document.getElementById('filter-node');
    if (nodeSelect) {
      const currentVal = nodeSelect.value;
      const nodes = getUniqueNodes(state.vms);
      nodeSelect.innerHTML = `<option value="all">All Nodes</option>` +
        nodes.map(n => `<option value="${esc(n)}"${currentVal === n ? ' selected' : ''}>${esc(n)}</option>`).join('');
    }
  } catch (e) {
    state.vms = [];
    state.vmsLoading = false;
    renderVMGrid();
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   Provisioning
   ═══════════════════════════════════════════════════════════════════════════ */

async function submitProvision() {
  // Capture any in-flight custom field values before re-rendering
  if (state.prov.profile === 'custom') {
    const coresEl  = document.getElementById('prov-cores');
    const memEl    = document.getElementById('prov-memory');
    const diskEl   = document.getElementById('prov-disk');
    if (coresEl)  state.prov.customCores   = +coresEl.value  || state.prov.customCores;
    if (memEl)    state.prov.customMemory  = +memEl.value    || state.prov.customMemory;
    if (diskEl)   state.prov.customDisk    = diskEl.value    || state.prov.customDisk;
  }

  const params = getProvisionParams();

  const btn = document.getElementById('btn-launch');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="border-top-color:#fff"></span>&nbsp;Launching…';
  }

  try {
    const resp = await api('POST', '/provision', params);
    state.activeJobId  = resp.jobId;
    state.provVMs      = {};
    state.jobDone      = false;
    state.jobEndedAt   = null;
    state.jobStartedAt = Date.now();
    (resp.specs || []).forEach(s => {
      state.provVMs[s.VMID] = { name: s.Name, step: null, ip: null, keyFile: null, error: null, message: null };
    });
    state.prov.stage = 'running';
    renderProvisionWizard();   // switch to pipeline view
    connectSSE(resp.jobId);
    startJobTimer();
  } catch (err) {
    toast('Provision failed: ' + err.message, 'error');
    if (btn) {
      btn.disabled = false;
      const count = state.prov.vmCount;
      btn.innerHTML = Icons.rocketLaunch + ' Deploy ' + (count > 1 ? count + ' VMs' : 'VM');
    }
  }
}

function connectSSE(jobId) {
  if (state.activeEventSource) state.activeEventSource.close();
  state.activeEventSource = new EventSource('/api/jobs/' + jobId + '/events');

  state.activeEventSource.onmessage = (e) => {
    const ev = JSON.parse(e.data);

    if (ev.step === 'job_complete') {
      state.activeEventSource.close();
      state.activeEventSource = null;
      state.jobDone      = true;
      state.jobEndedAt   = Date.now();
      state.prov.stage   = 'done';
      stopJobTimer();
      renderProvisionWizard();   // re-render page with 'Provision Another' button
      renderProvisionProgress(); // update pipeline cards to final state
      toast(ev.message, ev.message.includes('0 failed') ? 'success' : 'error');
      loadVMs();
      return;
    }

    if (ev.vmid && state.provVMs[ev.vmid]) {
      const vm = state.provVMs[ev.vmid];
      vm.step = ev.step;
      vm.message = ev.message;
      if (ev.ip) vm.ip = ev.ip;
      if (ev.keyFile) vm.keyFile = ev.keyFile;
      if (ev.error) vm.error = ev.error;
    }
    renderProvisionProgress();
  };
}

function startJobTimer() {
  stopJobTimer();
  state.jobTimerInterval = setInterval(() => {
    const el = document.getElementById('job-timer');
    if (el && state.jobStartedAt) {
      el.textContent = formatDuration(Date.now() - state.jobStartedAt);
    }
  }, 1000);
}

function stopJobTimer() {
  if (state.jobTimerInterval) {
    clearInterval(state.jobTimerInterval);
    state.jobTimerInterval = null;
  }
}

async function loadTemplateState(opts = {}) {
  const { forceRender = false } = opts;
  const module = state.templateMgr;
  module.loading = true;
  try {
    const q = encodeURIComponent(module.selectedTemplate || 'debian12-cloud');
    const data = await api('GET', `/templates/state?template=${q}`);
    module.selectedTemplate = data.selectedTemplate || module.selectedTemplate;
    module.templates = data.templates || [];
    module.nodes = data.nodes || [];
    module.logsByNode = data.logsByNode || {};
    module.clusterUsedVMIDs = data.clusterUsedVMIDs || [];
    module.suggestedVmids = data.suggestedVmids || {};

    const nodeNames = new Set((module.nodes || []).map(n => n.node));
    if (!module.buildNode || !nodeNames.has(module.buildNode)) {
      module.buildNode = module.nodes[0]?.node || '';
    }
    if (!module.selectedNode || !nodeNames.has(module.selectedNode)) {
      module.selectedNode = module.buildNode || module.nodes[0]?.node || '';
    }

    const selectedTpl = module.templates.find(t => t.name === module.selectedTemplate);
    const nodeState = (selectedTpl?.nodeStates || []).find(ns => ns.node === module.buildNode);
    if (nodeState?.vmid > 0) {
      module.vmidInput = Number(nodeState.vmid);
    } else {
      module.vmidInput = '';
    }
  } catch (err) {
    toast('Failed to load template state: ' + err.message, 'error');
  } finally {
    module.loading = false;
    if (state.page === 'templates' && (forceRender || !isTemplateInteractionActive())) {
      renderTemplatesPage();
    }
  }
}

async function assignTemplateStorage(templateName, node, storageId) {
  await api('POST', `/templates/${encodeURIComponent(templateName)}/nodes/${encodeURIComponent(node)}/storage`, {
    storageId,
  });
}

async function runTemplateBuild() {
  const module = state.templateMgr;
  const templateName = module.selectedTemplate || 'debian12-cloud';
  const node = module.buildNode;
  const vmid = Number(module.vmidInput);

  if (!node) {
    toast('Select a node before building', 'error');
    return;
  }

  module.busy = true;
  renderTemplatesPage();
  try {
    await api('POST', `/templates/${encodeURIComponent(templateName)}/build`, {
      node,
      vmid: Number.isFinite(vmid) && vmid > 0 ? vmid : 0,
      image: 'debian-12-generic-amd64.qcow2',
    });
    toast(`Template build started on ${node}`, 'success');
    await loadTemplateState({ forceRender: true });
  } catch (err) {
    toast('Build failed to start: ' + err.message, 'error');
  } finally {
    module.busy = false;
    renderTemplatesPage();
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   Config Loading
   ═══════════════════════════════════════════════════════════════════════════ */

async function loadNodes() {
  if (state.nodesLoading) return;
  state.nodesLoading = true;
  try {
    const nodes = await api('GET', '/nodes');
    state.nodes = (nodes || []).sort((a, b) => (a.node || '').localeCompare(b.node || ''));
    // Re-render the node section if drawer is open
    const nodeList = document.getElementById('drawer-sec-node');
    if (nodeList) {
      const inner = nodeList.querySelector('.node-list');
      if (inner) inner.innerHTML = nodesListHTML();
    }
  } catch (e) {
    state.nodes = [];
  } finally {
    state.nodesLoading = false;
  }
}

function nodesListHTML() {
  if (state.nodesLoading && state.nodes.length === 0) {
    return `<div class="node-loading"><span class="spinner"></span> Loading nodes…</div>`;
  }
  if (state.nodes.length === 0) {
    return `<div class="node-loading">No nodes found</div>`;
  }
  return state.nodes.map(n => {
    const name = n.node || '';
    const online = n.status === 'online';
    const cpuPct = n.maxcpu > 0 ? Math.round((n.cpu || 0) * 100) : 0;
    const memUsed = n.mem || 0;
    const memMax  = n.maxmem || 1;
    const memPct  = Math.round(memUsed / memMax * 100);
    const memUsedGB = (memUsed / 1073741824).toFixed(1);
    const memMaxGB  = (memMax  / 1073741824).toFixed(1);
    const sel = state.prov.node === name ? ' selected' : '';
    const offCls = !online ? ' offline' : '';
    return `
    <button class="node-card${sel}${offCls}" data-action="drawer-select-node" data-node="${esc(name)}">
      <div class="node-radio"></div>
      <div class="node-info">
        <span class="node-name">${esc(name)}</span>
        <span class="node-status-badge ${online ? 'online' : 'offline'}">${online ? 'Online' : 'Offline'}</span>
      </div>
      <div class="node-stats">
        <div class="node-stat-row">
          <div class="node-stat-hd">
            <span class="node-stat-label">CPU</span>
            <span class="node-stat-val">${cpuPct}% of ${n.maxcpu || 0} vCPU</span>
          </div>
          <div class="node-stat-bar"><div class="node-stat-fill cpu" style="width:${cpuPct}%"></div></div>
        </div>
        <div class="node-stat-row">
          <div class="node-stat-hd">
            <span class="node-stat-label">Memory</span>
            <span class="node-stat-val">${memUsedGB} / ${memMaxGB} GB</span>
          </div>
          <div class="node-stat-bar"><div class="node-stat-fill mem" style="width:${memPct}%"></div></div>
        </div>
      </div>
    </button>`;
  }).join('');
}

async function loadConfig() {
  try {
    const cfg = await api('GET', '/config');
    state.config = cfg;
    // Pre-populate provision wizard defaults from server config
    if (cfg.vmStartId)  state.prov.vmStartId = +cfg.vmStartId;
    render();
  } catch (e) {
    state.config = {};
    render();
  }
}

function setVal(id, val) {
  const el = document.getElementById(id);
  if (el) el.value = val;
}

/* ═══════════════════════════════════════════════════════════════════════════
   Initialization
   ═══════════════════════════════════════════════════════════════════════════ */

render();
loadConfig();
loadVMs();

// Auto-refresh VMs every 15s when on VMs page
setInterval(() => {
  if (state.page === 'vms' && !document.hidden) loadVMs();
}, 15000);

// Auto-refresh template state every 3s when on Templates page
setInterval(() => {
  if (state.page === 'templates' && !document.hidden) loadTemplateState({ forceRender: false });
}, 3000);

</script>
